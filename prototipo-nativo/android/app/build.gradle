plugins {
    id 'com.android.application'
}

def envFile = rootProject.file('../../src/environments/environment.prod.ts')
def envText = envFile.exists() ? envFile.getText('UTF-8') : ''
def envMatch = envText =~ /soundfontBaseUrl:\s*'([^']+)'/
def soundfontBaseUrl = System.getenv('SAMNAT_SOUNDFONT_BASE_URL') ?: (envMatch.find() ? envMatch.group(1) : '')
def escapedSoundfontBaseUrl = soundfontBaseUrl.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.samnat.synth'
    compileSdk 35

    defaultConfig {
        applicationId 'com.samnat.synth'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'SOUNDFONT_BASE_URL', '"' + escapedSoundfontBaseUrl + '"'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
                targets 'samnat_audio'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.1'
        }
    }

    ndkVersion '30.0.16248370'
}
