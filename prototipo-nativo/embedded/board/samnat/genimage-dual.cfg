image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
		file bzImage {
			image = "bzImage"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "SAMNAT_DATA"
	}
	mountpoint = "/data"
	size = "120%"
}

image samnat-synth-x86_64.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x53414d4e
		align = 1M
	}

	partition bios-boot {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = { "(440; 512)" }
	}

	partition bios-core {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition efi {
		partition-type = 0xef
		image = "efi-part.vfat"
		bootable = true
	}

	partition root {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
