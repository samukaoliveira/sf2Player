image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
		file bzImage {
			image = "bzImage"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "SAMNAT_DATA"
	}
	size = 4096M
}

image samnat-synth-x86_64.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		partition-type-uuid = U
		image = "efi-part.vfat"
		bootable = true
	}

	partition root {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = 3b816b4b-8a8e-41ab-9d0d-000000000001
		image = "rootfs.ext4"
	}

	partition data {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = 3b816b4b-8a8e-41ab-9d0d-000000000002
		image = "data.ext4"
	}
}
