set default=0
set timeout=5

menuentry "Start SamNat Synth (USB)" {
    set root='(hd0,msdos2)'
    linux /boot/bzImage root=PARTUUID=53414d4e-02 rootwait rootfstype=ext4 rw console=tty1 quiet loglevel=3 logo.nologo vt.global_cursor_default=0
}

menuentry "Install SamNat Synth to internal SSD" {
    set root='(hd0,msdos2)'
    linux /boot/bzImage root=PARTUUID=53414d4e-02 rootwait rootfstype=ext4 rw console=tty1 quiet loglevel=3 logo.nologo vt.global_cursor_default=0 samnat.install=1
}
