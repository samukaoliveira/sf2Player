Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "DontVTSwitch" "false"
EndSection

Section "Device"
    Identifier "SamNat EFI framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "SamNat Screen"
    Device "SamNat EFI framebuffer"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "SamNat Layout"
    Screen "SamNat Screen"
EndSection
