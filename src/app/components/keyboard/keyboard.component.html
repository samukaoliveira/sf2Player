
<div class="keyboard-container"
    tabindex="0"
    (keydown)="aoPressionarTecla($event)"
    (keyup)="aoSoltarTecla($event)"
    (window:blur)="liberarTeclasFisicas()">

  <header class="keyboard-header">
    <div>
      <h2>MIDI SoundFont Mixer</h2>
      <p>Quatro slots independentes de instrumentos</p>
    </div>

    <button
      type="button"
      class="botao-iniciar"
      *ngIf="!pronto"
      [disabled]="inicializando"
      (click)="iniciarAudio()">
      {{ inicializando ? 'Carregando...' : 'Iniciar áudio' }}
    </button>

    <span class="status" *ngIf="pronto">
      Áudio pronto
    </span>
  </header>

  <p class="erro" *ngIf="erro">
    {{ erro }}
  </p>

  <!-- Slots de SoundFont -->
  <section class="slots">

    <article
      class="slot"
      *ngFor="let sf of soundfonts; let i = index">

      <div class="slot-header">
        <h3>{{ sf.nome }}</h3>
        <span class="slot-numero">SLOT {{ i + 1 }}</span>
      </div>

      <!-- Seleção do arquivo SF2 -->
      <label [for]="'sf-' + i">SoundFont</label>

      <select
        [id]="'sf-' + i"
        [ngModel]="sf.arquivo"
        [disabled]="!pronto"
        (ngModelChange)="trocarSoundFont(sf, $event)">

        <option value="">Selecione um SoundFont</option>

        <option
          *ngFor="let opcao of soundfontCatalogo"
          [value]="opcao.arquivo">
          {{ opcao.nome }}
        </option>
      </select>

      <!-- Banco MIDI -->
      <label [for]="'banco-' + i">Banco MIDI</label>

      <input
        [id]="'banco-' + i"
        type="number"
        min="0"
        max="16383"
        [ngModel]="sf.banco"
        [disabled]="!pronto || !sf.arquivo"
        (ngModelChange)="alterarBanco(sf, $event)">

      <!-- Programa selecionado pelo nome -->
      <label [for]="'programa-' + i">Instrumento</label>

      <select
        [id]="'programa-' + i"
        [ngModel]="sf.banco + ':' + sf.programa"
        [disabled]="!pronto || !sf.arquivo || !sf.programas.length"
        (ngModelChange)="selecionarProgramaPorNome(sf, $event)">

        <option
          *ngFor="let p of sf.programas"
          [ngValue]="p.banco + ':' + p.programa">

          {{ p.programa + 1 }} —
          {{ p.nome }}

        </option>
      </select>

      <div *ngIf="pronto && sf.arquivo && !sf.programas.length">
        Nenhum preset encontrado neste SoundFont.
      </div>

      <!-- Volume individual -->
      <div class="volume-header">
        <label [for]="'volume-' + i">Volume</label>
        <span>{{ sf.volume }}%</span>
      </div>

      <input
        class="volume-slider"
        [id]="'volume-' + i"
        type="range"
        min="0"
        max="100"
        [ngModel]="sf.volume"
        [disabled]="!pronto || !sf.arquivo"
        (ngModelChange)="alterarVolume(sf, $event)">

      <!-- Ativação independente -->
      <label class="ativo">
        <input
          type="checkbox"
          [ngModel]="sf.ativo"
          [disabled]="!pronto || !sf.arquivo"
          (ngModelChange)="alternarSoundFont(sf, $event)">
        <span>Ativar instrumento</span>
      </label>

    </article>

  </section>

  <!-- Sustain -->
  <section class="controles">
    <h3>Controles de execução</h3>

    <button
      type="button"
      [class.ativado]="sustainAtivado"
      [disabled]="!pronto"
      (click)="alternarSustain()">
      Sustain {{ sustainAtivado ? 'ligado' : 'desligado' }}
    </button>

    <button
      type="button"
      class="pedal"
      [class.ativado]="sustainPressionado"
      [disabled]="!pronto"
      (pointerdown)="pressionarSustain()"
      (pointerup)="soltarSustain()"
      (pointerleave)="soltarSustain()"
      (pointercancel)="soltarSustain()">
      Pedal sustain
    </button>

    <button
      type="button"
      (click)="conectarControladorMidi()"
      [disabled]="!pronto || controladorMidi.conectado">
      Conectar controlador MIDI
    </button>

    <span *ngIf="controladorMidi.conectado">
      MIDI conectado: {{ controladorMidi.nomeDispositivo }}
    </span>

    <p *ngIf="erro">
      {{ erro }}
    </p>
  </section>
