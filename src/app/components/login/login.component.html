<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="brand-mark" aria-hidden="true">
      <span class="key key-white"></span>
      <span class="key key-black"></span>
      <span class="key key-white"></span>
      <span class="key key-black"></span>
      <span class="key key-white"></span>
      <span class="key key-white"></span>
      <span class="key key-black"></span>
      <span class="key key-white"></span>
      <span class="key key-black"></span>
      <span class="key key-white"></span>
      <span class="key key-black"></span>
      <span class="key key-white"></span>
    </div>

    <p class="eyebrow">SAMNAT SYNTH</p>
    <h1 id="login-title">Bem-vindo de volta</h1>
    <p class="intro">Entre para continuar sua experiência musical.</p>

    <form (ngSubmit)="login()">
      <p class="error-message" [class.success-message]="cadastroSucesso" role="status" *ngIf="message">{{ message }}</p>

      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="voce@exemplo.com" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input id="senha" type="password" [(ngModel)]="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>

    <p class="card-footer"><span class="status-dot" aria-hidden="true"></span> Seu espaço para criar e explorar música</p>
    <p class="account-link">Ainda não tem uma conta? <a routerLink="/cadastro">Cadastre-se</a></p>
  </section>
</main>
